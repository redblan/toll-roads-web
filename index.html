<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автодор – 3D инфраструктура платных дорог</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <h1>🛣 Автодор</h1>
            <span class="subtitle">3D инфраструктура платных дорог</span>
        </div>
    </header>
    <div class="filter-bar">
        <div class="filter-group">
            <label>🔍 Поиск:</label>
            <input type="text" id="search-input" placeholder="Название модели..." class="search-input">
        </div>
        <div class="filter-group">
            <label>📂 Категория:</label>
            <select id="category-select" class="category-select">
                <option value="all">Все категории</option>
                <option value="Транспорт">🚗 Транспорт</option>
                <option value="Инфраструктура">🛣 Инфраструктура</option>
                <option value="Оборудование">🚦 Оборудование</option>
                <option value="Сооружение">🌉 Сооружение</option>
            </select>
        </div>
        <button id="btn-search" class="btn reset-btn">🔍 Найти</button>
        <button id="reset-filters" class="btn reset-btn">Сбросить фильтры</button>
    </div>
    <main>
        <div class="gallery-grid" id="gallery-grid"></div>
    </main>
    <footer class="footer">
        <p>© Баринов Егор, ИУ5-41Б — 3D галерея объектов дорожной инфраструктуры</p>
    </footer>
    <script src="app.js" type="module"></script>
</body>
</html>
